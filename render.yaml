services:
  - type: web
    name: smartbiz-server-cfmp
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm --prefix client run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.12.0"
      - key: CLIENT_ORIGIN
        value: https://smartbiz-lake.vercel.app,https://smartbiz-management-system.netlify.app
      - key: MYSQL_URL
        sync: false
      - key: MYSQL_SSL_CA
        value: certs/isrgrootx1.pem
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: PASSWORD_RESET_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_SECURE
        value: "false"
