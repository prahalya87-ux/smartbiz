services:
  - type: web
    name: smartbiz-server-cfmp
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm --prefix client run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://smartbiz-management-system.netlify.app
      - key: MYSQL_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
